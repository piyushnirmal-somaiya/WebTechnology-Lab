        // 7.generic function
        console.log("// 7.generic function")
        function sum(...num){
        var res = 0;
            for (var i = 0;i < arguments.length;i++)
            res += arguments[i];
                
            return res;
        }

        console.log("sum(11,22)= ",sum(11,22));
        console.log("sum(11,22,33)= ",sum(11,22,33));
        console.log("sum(11,22,33,44,55,66,77)= ",sum(11,22,33,44,55,66,77));

        function sub(...num) {
        var result = num[0];
        for (var i = 1; i < num.length; i++) {
        result -= num[i];
    }
         return result;
}
