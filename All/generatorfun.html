<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>generator Function</title>
    <script>

        //10. generator function 
        var empid = 101;
        function* generateEmpid(){
            while(true){
                yield empid;
                console.log("empid: ",empid);
                empid++;
            }
        }
        
        const generator = generateEmpid();

        console.log(generator.next());
        console.log(generator.next());
        console.log(generator.next());
        console.log(generator.next());
        console.log(generator.next());
        console.log(generator.next());

        //     }
        // }
        // abc()

        function functionAsParameter(callback){
            console.log("welcome to the functionAsParameter()");

            return callback();
        }
        
    </script>
</head>
